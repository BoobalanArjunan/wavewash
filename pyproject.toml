[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wavewash"
version = "0.2.0a1"
description = "WaveWash: audio QC & data prep - check, repair, dedupe and audit audio datasets for ML training (ASR, TTS, speaker ID, music generation), with a local web UI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Boobalan Arjunan" },
  { email = "boobalan.it@gmail.com" },
]
maintainers = [
  { name = "Boobalan Arjunan" },
  { email = "boobalan.it@gmail.com" },
]
keywords = ["audio", "dataset", "quality-control", "asr", "tts", "machine-learning", "data-preparation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "soundfile>=0.12",
  "librosa>=0.10",
  "pyloudnorm>=0.1.1",
  "scikit-learn>=1.2",
  "tqdm>=4.65",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
lang = ["langdetect>=1.0.9"]
plots = ["matplotlib>=3.5"]
vad = ["torch>=2.0", "torchaudio>=2.0"]
whisper = ["openai-whisper"]
dev = ["pytest>=7", "httpx>=0.25"]
all = ["langdetect>=1.0.9", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/BoobalanArjunan/wavewash"
Source = "https://github.com/BoobalanArjunan/wavewash"
Issues = "https://github.com/BoobalanArjunan/wavewash/issues"

[project.scripts]
wavewash = "wavewash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wavewash = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
